<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple HTML Table</title>
    <style>
    table {
        width: 50%;
        border-collapse: collapse;
        margin: 20px auto;
        text-align: center;
    }
    td {
        padding: 10px;
    }
</style>
</head>
<body>

   <table border="1">
    <tr>
        <td>Enchanted Golden Apple <img src="enchanted-golden-apple.jpeg" width="100px" > </td>
        <td>Diamonds <img src="diamond.png" width="100px" > </td>
        <td>Blaze Powder <img src="blaze-powder.png" width="100px" > </td>
    </tr>
    <tr>
        <td>Music Disc Stal <img src="stal.jpg" width="100px" > </td>
        <td>Creeper <img src="creeper.png" width="50px" > </td>
        <td>Ender Pearl <img src="ender-pearl.png" width="100px" > </td>
    </tr>
    <tr>
        <td>Wolf <img src="wolf.png" width="100px" > </td>
        <td>Oak wood <img src="oak-wood.png" width="100px" > </td>
        <td>Lava <img src="lava-bucket.png" width="100px" > </td>
    </tr>
</table>

</body>
</html>
