<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple HTML Table</title>
    <style>
    table {
        width: 50%;
        border-collapse: collapse;
        margin: 20px auto;
        text-align: center;
    }
    td {
        padding: 10px;
    }
</style>
</head>
<body>

   <table border="1">
    <tr>
        <td>Enchanted Golden Apple <img src="enchanted-golden-apple.jpeg"> </td>
        <td>Diamonds</td>
        <td>Blaze Powder</td>
    </tr>
    <tr>
        <td>Music Disc Stal</td>
        <td>Creeper</td>
        <td>Crowsbow</td>
    </tr>
    <tr>
        <td>Wolf</td>
        <td>Spruce wood/td>
        <td>Lava</td>
    </tr>
</table>

</body>
</html>
